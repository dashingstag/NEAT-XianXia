[workspace]
members = ["crates/neat-core", "crates/sim-core", "crates/sim-runner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
postcard = { version = "1", features = ["alloc"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
incremental = false

[profile.test]
incremental = false

