<!doctype html>

<title>NEAT Xianxia — teardown report</title>
<style>/* teardown-audit report — light studio, one accent. Pale reads in a feed. */
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #16181b; --muted: #6b7280; --dim: #9aa0a7;
  --line: #e3e5e8; --soft: #f0f2f5; --amber: #b97a0b; --amber-bg: #fef7e6;
  --red: #c92a2a; --orange: #d95f18; --yellow: #b97a0b; --green: #2b8a3e; --black: #111315;
  --mono: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
  --sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
button { font-family: inherit; }

/* ---- top bar ---- */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .2px; }
.top h1 i { font-style: normal; color: var(--amber); }
.top .date { font: 500 11px var(--mono); color: var(--dim); }
.counts { display: flex; gap: 5px; flex-wrap: wrap; }
.count { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 2px 9px; font: 700 11px var(--mono); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.count:hover { border-color: var(--amber); }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 14px; font: 700 12.5px var(--sans); color: var(--muted); cursor: pointer; }
.tab:hover { background: var(--soft); }
.tab.on { background: var(--ink); color: #fff; }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.s-red { background: var(--red); } .s-orange { background: var(--orange); }
.s-yellow { background: var(--yellow); } .s-green { background: var(--green); } .s-black { background: var(--black); }
.t-red { color: var(--red); } .t-orange { color: var(--orange); } .t-yellow { color: var(--yellow); }
.t-green { color: var(--green); } .t-black { color: var(--black); }

.page { max-width: 1240px; margin: 0 auto; padding: 22px 24px 80px; }
.hide { display: none !important; }

/* ---- PIPELINE tab ---- */
.conduit { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 6px 2px 14px; }
.stn { min-width: 132px; flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; position: relative; }
.stn:hover { border-color: var(--amber); }
.stn.on { border-color: var(--amber); background: var(--amber-bg); }
.stn .nm { font: 800 11px var(--mono); letter-spacing: 1px; text-transform: uppercase; }
.stn .mt { font: 500 10.5px var(--mono); color: var(--muted); margin-top: 5px; line-height: 1.5; }
.stn .halo { position: absolute; top: 10px; right: 10px; }
.stn .vfy { color: var(--red); font-weight: 700; }
.arr { align-self: center; color: var(--dim); font-weight: 700; padding: 0 5px; flex-shrink: 0; }
.loopnote { font: 500 12px var(--mono); color: var(--muted); margin: 0 0 18px; padding: 8px 12px; background: var(--soft); border-radius: 6px; border-left: 3px solid var(--amber); }

.pipe-grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
.plist { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.plist .ph { padding: 10px 14px; border-bottom: 1px solid var(--line); font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); display: flex; justify-content: space-between; }
.plist .blurb { padding: 8px 14px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--soft); line-height: 1.5; }
.prow { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--soft); background: transparent; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.prow:hover { background: var(--soft); }
.prow.on { background: var(--amber-bg); }
.prow .lb { font: 600 12.5px var(--sans); flex: 1; }
.prow .lc { font: 500 10px var(--mono); color: var(--dim); }
.vbadge { font: 700 9px var(--mono); color: var(--red); border: 1px dashed var(--red); border-radius: 4px; padding: 0 4px; }

/* ---- dossier (shared) ---- */
.dossier { display: flex; flex-direction: column; gap: 14px; }
.d-hd { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.d-hd .crumb { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.d-hd h2 { margin: 4px 0 8px; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font: 700 11px var(--mono); padding: 2px 10px; border-radius: 99px; color: #fff; text-transform: uppercase; }
.p-red { background: var(--red); } .p-orange { background: var(--orange); } .p-yellow { background: var(--yellow); }
.p-green { background: var(--green); } .p-black { background: var(--black); }
.pill-vfy { font: 700 10px var(--mono); padding: 2px 8px; border-radius: 99px; color: var(--red); border: 1.5px dashed var(--red); background: #fff5f5; }
.meta-line { font: 500 12px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; }
.card h3 { margin: 0 0 7px; font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); }
.card p { margin: 0; font-size: 13.5px; line-height: 1.55; color: #2b2f36; white-space: pre-wrap; }
.card.warn { border-left: 3.5px solid var(--red); background: #fffafa; }
.card.fix { border-left: 3.5px solid var(--amber); background: var(--amber-bg); }
.card.fix p { color: #543b06; font-weight: 500; }
.metrics { display: flex; flex-wrap: wrap; gap: 8px; }
.mbox { border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; font: 600 11.5px var(--mono); background: var(--bg); }
.mbox .k { display: block; font-size: 9.5px; color: var(--dim); text-transform: uppercase; margin-bottom: 2px; }
.mbox.bad { border-color: var(--red); color: var(--red); }
.deps { display: flex; flex-wrap: wrap; gap: 6px; }
.dep { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 10px; font: 500 11.5px var(--mono); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.dep:hover { border-color: var(--amber); background: var(--amber-bg); }
.dep i { font-style: normal; color: var(--dim); font-size: 10px; }
pre.code { margin: 8px 0 0; background: #16181b; color: #e6edf3; padding: 12px 14px; border-radius: 6px; overflow-x: auto; font: 500 11.5px/1.55 var(--mono); }
pre.code .ln { color: #586069; user-select: none; display: inline-block; width: 3.4em; text-align: right; margin-right: 12px; }
.ex-h { font: 600 11px var(--mono); color: var(--muted); margin-top: 12px; }

/* ---- ISSUES tab ---- */
.issues { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
.iside { background: var(--card); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; max-height: calc(100vh - 110px); position: sticky; top: 76px; }
.iside .flt { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: 500 12px var(--sans); outline: none; background: var(--bg); }
.search:focus { border-color: var(--amber); background: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 99px; padding: 3px 9px; font: 600 11px var(--mono); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip:hover { background: var(--soft); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.ilist { overflow-y: auto; padding: 6px 8px 20px; }
.st-h { font: 700 10px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); padding: 9px 8px 3px; }

/* ---- EXPLAINER tab ---- */
.expl { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.expl .lead { font-size: 15.5px; line-height: 1.65; color: #2b2f36; }
.expl blockquote { margin: 0; padding: 12px 16px; background: var(--amber-bg); border-left: 3.5px solid var(--amber); border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.6; }
.expl h2 { font-size: 18px; margin: 6px 0 0; }
.expl h3 { font-size: 14px; margin: 0; }
table.rub { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table.rub th { text-align: left; font: 700 10.5px var(--mono); text-transform: uppercase; letter-spacing: .8px; color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.rub td { padding: 9px 10px; border-bottom: 1px solid var(--soft); vertical-align: top; line-height: 1.5; }
table.rub tr:last-child td { border-bottom: 0; }
.expl ol, .expl ul { margin: 6px 0; padding-left: 22px; font-size: 13.5px; line-height: 1.65; }
.expl code { font: 600 12px var(--mono); background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.stepgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.stepcard { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; }
.stepcard .n { font: 800 11px var(--mono); color: var(--amber); letter-spacing: 1px; }
.stepcard .t { font-weight: 700; font-size: 13px; margin: 3px 0 4px; }
.stepcard .d { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

.empty { padding: 40px 16px; text-align: center; color: var(--dim); font-size: 13px; }
@media (max-width: 980px) {
  .pipe-grid, .issues, .grid2 { grid-template-columns: 1fr; }
  .iside { position: static; max-height: 300px; }
}
</style>
</head>

<script>window.AUDIT = {"doc":"Curated teardown audit of NEAT Xianxia (Rust sim + Godot viewer + Python harness). Every score carries file + whyScore + excerpts. Suspicions carry verify:true. Generated by the teardown-audit skill.","meta":{"name":"NEAT Xianxia","conduit":"scenarios.toml/CLI options → worldgen → deterministic tick loop (offer → NEAT score → serial apply → domain steps → ledger check) → XNS1 snapshot + XXSAVE34 checkpoint → loopback TCP → Godot decode → render/pick; births feed parent genomes back via crossover+mutation and the save ladder re-enters history through 31 versions; dev.py checks feed pass/fail upstream","generated":"2026-11-23"},"stations":{"contract":{"label":"CONTRACT","blurb":"the single source of truth: wire + save + scenario definitions and the three real old-bytes fixtures","parts":[{"id":"contract_readme","label":"wire/save prose contract","file":"contracts/README.md","what":"Prose contract for the TCP wire (XNC1/XNS1 framing, 16-byte records, 6-bit action IDs, map_layers base64 grids) and the full XXSAVE version history 01→34.","why":"The only document binding the Rust encoder, the GDScript decoder, and the save ladder to one description; check_protocol.py enforces its testable claims.","deps":{"snapshot_encoder":"data","field_decoder":"data","load_ladder":"data","protocol_checks":"test"},"breaks":"Prose says 'Action IDs occupy six bits', 'Current saves use XXSAVE34' and documents the 4 MiB frame budget and building stream — all match code today. The 31-version save history is still hand-written prose; the loader's authority is the SaveVersion table (lib.rs:563-610), so a new version whose prose is not updated leaves no machine-visible drift.","score":"yellow","whyScore":"Wire claims are test-verified: header/record layout and 52 sensors by check_protocol.py:40-79, the streamed-building framing by check_streaming.py (two 256-row batches, reset/load clearing). The save history paragraph has no parity check, but the code it describes is now one capability table.","metrics":{"loc":33,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"contracts/README.md","s":19,"e":19,"text":"Each wire message has a four-byte little-endian payload length. Commands are UTF-8 JSON. Replies begin with XNC1 and JSON. Snapshot payloads begin with XNS1, followed by little-endian version (u16), flags (u16, bit zero means paused), tick (u64), allocated count (u32), sample count (u32), metadata byte length (u32) and, since version 2, animal record count (u32). JSON metadata, sample records, then animal records follow. Each 16-byte sample contains ID (u32), x/y (f32), and four bytes for action/flags, cargo/flags, health/age flag, and home. Each 16-byte animal record contains ID (u32), x/y (f32), species (u8), action (u8), health (u8, top bit means young) and heading (u8, fraction of 2pi). The viewer rebuilds wildlife.animals from the records; full experiment reports keep the JSON array. Action IDs occupy six bits. Coordinate and ID changes must agree across the encoder, field renderer and picking implementation."},{"file":"contracts/README.md","s":33,"e":33,"text":"Current saves use XXSAVE34 for the merged gameplay features, governance, campsite rumours, water routes and road traffic. XXSAVE33 added road traffic to the release format. XXSAVE32 stores the water-route state alongside governance and campsite rumours. XXSAVE31 adds campsite rumours to XXSAVE30, which stores governance and temporary happiness awards. XXSAVE29 added local meat sales history. XXSAVE28 added personal market knowledge and the tavern report trade. XXSAVE27 used shared market reports. XXSAVE26 added carried meat, market stock, and the meat trade ledger. XXSAVE25 added the weapon goal. XXSAVE24 introduced bows and hunting counters. XXSAVE23 introduced crafted hunting spears. XXSAVE22 records the terrain anchors of hidden wildlife spawn points. Upgrading from XXSAVE21 preserves the existing forest timers and spawn count and adds mountain and shoreline sites. The XXSAVE20 envelope added finite wildlife carcass stocks to the XXSAVE19 payload. That payload includes the world, the procedural map specification, exploration state, and outcome-memory payloads. The loader accepts the plain XXSAVE15 world from the 48-sensor rollout, the subsequent XXSAVE15 procedural map payload, and the experimental XXSAVE15 through XXSAVE18 memory envelopes. Legacy 42-sensor genomes migrate to the widened schema while retaining optional memory nodes and their connections. The world publishes its hill center and radius in the snapshot field `hill`. Saves through version 13 restore the historical center (1500, 1380) and radius 360. The included v12 fixture exercises the introduction of relationship state. Saves 1 through 3 predate the supported migration range. For a persistent field, test load, advance, save, reopen and replay. For an optional inspector field, exercise both an older frame and a frame containing the field."},{"file":"contracts/README.md","s":37,"e":46,"text":"Server-to-viewer payloads are limited to 4 MiB, excluding the four-byte\nlength prefix. The server returns a bounded XNC1 diagnostic if an encoded\nsnapshot or reply is too large. The connection stays available for commands.\n\nClients can send `stream_buildings` to receive compact XNS1 snapshots with\n`building_stream: true`. These omit building rows. XNC1 updates carry\n`building_batch` arrays and their zero-based `building_offset`. An update\nends with `building_count`, which applies the pending rows and truncates\nremoved entries. A reset or load clears the stream before sending the new\nworld's rows. Clients that do not opt in still receive embedded building rows."}]},{"id":"project_toml","label":"contract + toolchain constants","file":"project.toml","what":"Machine-readable [contracts] wire=2/save=34, the three save fixture paths (old_save v12, dev_save v34, release_save v33) and toolchain pins.","why":"dev.py and CI read these constants; it is the machine-checkable third of the contract.","deps":{"dev_py":"data","load_ladder":"data","snapshot_encoder":"data"},"breaks":"Bumping wire/save constants here without the code produces a version the loader rejects — but it is a third hand-maintained copy of values that live in code.","score":"green","whyScore":"Verified at this revision: wire=2 matches the encoder header and check_protocol.py:41; save=34 matches SaveVersion::CURRENT (lib.rs:569) and the b\"XXSAVE34\" writer; each fixture path exists and its header matches its name. dev_save/release_save are documentation for now — the Rust tests load those files by path, not through this table.","metrics":{"loc":17,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"project.toml","s":13,"e":19,"text":"[contracts]\nwire = 2\nsave = 34\nold_save = \"fixtures/bank-v12.snapshot\"\ndev_save = \"fixtures/dev-v34.snapshot\"\nrelease_save = \"fixtures/release-v33.snapshot\"\ntown_frame = \"fixtures/town-shop.json\""}]},{"id":"scenarios","label":"named launch scenarios","file":"world/scenarios.toml","what":"Six named scenarios (founders/protocol at classic size, frontier-x4/x25/x100 generated maps, mature-town checkpoint bench).","why":"dev.py reads it to spawn backends and offer `play --scenario` choices.","deps":{"dev_py":"data","worldgen":"data"},"breaks":"A scenario referencing a missing checkpoint or unknown map key fails at launch, loudly.","score":"green","whyScore":"Consumed by dev.py:68-72 (agents/seed/map keys) and dev.py:338 choices are derived from the file itself — no parallel copy.","metrics":{"loc":29,"testLines":0,"comments":3,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"world/scenarios.toml","s":27,"e":29,"text":"[mature-town]\ncheckpoint = \"fixtures/bank-v12.snapshot\"\nsteps = 100"}]},{"id":"fixture_bank_v12","label":"checked-in save fixtures (v12, v33, v34)","file":"fixtures/bank-v12.snapshot","what":"bank-v12 is the synthetic bank-demo checkpoint in the schema-12 format, kept as its original bytes; dev-v34 (current writer) and release-v33 (5c636c9, the last v33 writer) are real writer output that cover the two newer format families.","why":"The only end-to-end proof that World::load migrates stored bytes rather than bytes synthesized from current types: one fixture per format family, loaded by the protocol suites and the fixture tests.","deps":{"load_ladder":"test","legacy_v12":"test","dev_py":"test"},"breaks":"Legacy readers v4-11 and v13-18 have no fixture at all, and v12 has only the synthetic checkpoint; a drift in a nested type they embed is caught by the schema pin test, not by a fixture (see legacy_readers).","score":"green","whyScore":"Every format family has a checked-in fixture: bank-v12 feeds the protocol, bank, relationship and replay suites; real_dev_format_fixture_loads_and_checks and real_release_format_fixture_loads_and_checks (lib.rs:4219, 4239) load, check and step the real v34 and v33 output. Remaining legacy-version coverage is tracked under legacy_readers (#54).","metrics":{"loc":0,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"fixtures/README.md","s":9,"e":12,"text":"\n- **Legacy readers (v4-18):** `bank-v12.snapshot` is the only real artifact; other versions have synthetic readers tests only.\n- **Development tuple+tails (v20-29, 34):** `dev-v34.snapshot` covers the tail-chain layout with real bytes; v20-29 tail ordering is pinned synthetically by `tests::dev_format_tail_walk_is_pinned`.\n- **Release tuple+Action-remap (v19, 30-33):** `release-v33.snapshot` covers the family with real bytes, produced by rebuilding `5c636c9` (the last v33 writer). No real v19/v30-32 artifacts exist; the synthetic `tests::release_checkpoints_restore_their_original_action_indices` pins their tail order and index remap."},{"file":"sim/crates/sim-core/src/lib.rs","s":4221,"e":4233,"text":"    #[test]\n    fn real_dev_format_fixture_loads_and_checks() {\n        let path = concat!(\n            env!(\"CARGO_MANIFEST_DIR\"),\n            \"/../../../fixtures/dev-v34.snapshot\"\n        );\n        let mut restored = World::load(Path::new(path)).unwrap();\n        restored.check().unwrap();\n        for _ in 0..3 {\n            restored.step(false);\n        }\n        restored.check().unwrap();\n    }"}],"fix":"fixture_bank_v12"},{"id":"fixture_town_shop","label":"recorded viewer frame","file":"fixtures/town-shop.json","what":"A recorded snapshot-metadata frame used by headless viewer checks (urban_ui_check.gd) without a live backend.","why":"Decouples viewer verification from a running sim — the fixture pins the metadata shape the UI reads.","deps":{"dev_py":"test","viewer_bench":"test"},"breaks":"If snapshot_metadata drops a key the fixture keeps asserting the old shape — it verifies UI code, not producer drift.","score":"green","whyScore":"Exercised by dev.py viewer(): runs urban_ui_check.gd --quit-after 150 headless and requires '\"urban_ui\":\"passed\"' in output (dev.py:172-184).","metrics":{"loc":0,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"tools/dev.py","s":189,"e":196,"text":"    command += [\"--script\", \"res://bench/urban_ui_check.gd\", \"--\", ROOT / CONTRACT[\"town_frame\"]]\n    if preview:\n        command.append(\"--preview\")\n    result = subprocess.run(command, capture_output=True, text=True, errors=\"replace\", check=False)\n    output = result.stdout + result.stderr\n    (run / \"viewer.txt\").write_text(output, encoding=\"utf-8\")\n    if result.returncode or \"SCRIPT ERROR\" in output or (not preview and '\"urban_ui\":\"passed\"' not in output):\n        raise RuntimeError(f\"Viewer check failed. See {run / 'viewer.txt'}\")"}]}]},"transforms":{"label":"TRANSFORMS","blurb":"the compute units: tick orchestrator, candidate offers, action resolution, domain step modules","parts":[{"id":"step_orchestrator","label":"World::step — 20-phase tick","file":"sim/crates/sim-core/src/lib.rs","what":"One tick: shelter sync → domestic rules → patch renewal → hunger/health/deaths → governance/civic → market+camp observation → parallel NEAT decisions → serial commit → travel → execute → settlement/life/farm/social/education/urban/banking/relationships/wildlife → explored/water/ports/ships → traffic census → quote refresh.","why":"The defined order IS the game rules: death→memory-forget→decision→movement→domain settles in sequence; ARCHITECTURE_REVIEW #4 names write-ownership order as the invariant to preserve.","deps":{"offer_pipeline":"data","execute_dispatch":"data","travel_module":"data","domain_steps":"data","economy_refresh":"data","replay_test":"test"},"breaks":"Phase order is held only by code order + replay digest tests; swapping e.g. deaths after decisions changes outcomes silently in serial mode — serial_and_parallel_results_match (lib.rs:4028) and checkpoint_replays_exactly are the guard.","score":"yellow","whyScore":"Documented ordering contract (ARCHITECTURE_REVIEW.md #4) enforced mechanically by determinism tests at lib.rs:4028 and 4052; still a single 230-line function whose phases are only separable by reading it.","metrics":{"loc":231,"testLines":0,"comments":6,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"sim/crates/sim-core/src/lib.rs","s":2270,"e":2311,"text":"        self.sync_rest_reservations();\n        self.travel_step();\n        let len = self.agents.len();\n        let offset = self.tick as usize % len;\n        for j in 0..len {\n            let i = (j + offset) % len;\n            if self.agents.alive[i] && self.agents.convoy[i] == NONE {\n                self.agents.sleeping[i] = false;\n                if self.watch.memory_trial.is_some() {\n                    self.execute_with_memory_pilot(i);\n                } else {\n                    self.execute(i);\n                }\n            }\n        }\n        self.start_projects();\n        self.settlement_step();\n        self.life_step();\n        self.farm_step s/sim-core/src/lib.rs","s":1894,"e":1924,"text":"        let best = out[..count]\n            .iter()\n            .filter(|c| !self.target_unreachable(i, c.action, c.target))\n            .max_by(|a, b| a.score.total_cmp(&b.score))\n            .copied();\n        // A starving mover offered nothing better than Wait still walks:\n        // any move toward a market or a job beats standing on a dead shore\n        // until the hunger meter runs out.\n        let best = if self.agents.hunger[i] >= 55.0\n            && best.is_some_and(|c| c.action == Action::Wait)\n        {\n            out[..count]\n                .iter()\n                .filter(|c| {\n                    c.action != Action::Wait\n                        && !self.target_unreachable(i, c.action, c.target)\n                })\n                .max_by(|a, b| a.score.total_cmp(&b.score))\n                .copied()\n                .or(best)\n        } else {\n            best\n        };\n        // When every offer is water-blocked the mover has nothing better\n        // to try — keep its best anyway rather than freeze the decision.\n        best.or_else(|| {\n            out[..count]\n                .iter()\n                .max_by(|a, b| a.score.total_cmp(&b.score))\n                .copied()\n        })"}]},{"id":"execute_dispatch","label":"execute() + destination() twin dispatch","file":"sim/crates/sim-core/src/lib.rs","what":"execute() resolves each committed action (movement, exchanges, jobs); travel.rs:destination() independently re-maps the same Action set to movement targets.","why":"Two dispatch tables over one enum — every new Action must be added to both or it either never resolves or never routes.","deps":{"action_enum":"data","offer_pipeline":"data","travel_module":"data","domain_steps":"data"},"breaks":"An action added to execute() but not destination() compiles fine and the agent walks to the default market branch instead of its real target — silent mis-routing; no exhaustiveness c ,"text":"    pub fn check(&self) -> Result<(), String> {\n        self.validate_schema()?;\n        for a in self.accounts() {\n            if a.error != 0 {\n                return Err(format!(\"{} conservation error {}\", a.product, a.error));\n            }\n        }\n        if self.coins() != self.ledger.initial_coins + self.ledger.minted_coins {\n            return Err(\"Coin conservation error\".into());\n        }\n        for i in 0..self.agents.len() {\n            if self.agents.weight(i) > self.agents.capacity[i] {\n                return Err(format!(\"Agent {i} exceeds carrying capacity\"));\n            }\n        }\n        self.validate_wildlife()?;\n        self.validate_governance()?;\n        self.validate_camp_rumours()?;\n        self.validate_meat_trade()?;\n        self.validate_market_information()?;\n        self.validate_education()?;"}]},{"id":"validate_gate","label":"load-time validate() schema gate","file":"sim/crates/sim-core/src/lib.rs","what":"Post-deserialize invariant sweep: all 36 SoA column lengths == n, markets 3..=64, home/cargo_kind bounds, convoy membership bijection, plus 10 domain validate_* calls.","why":"The last line of defense for corrupt/old saves — every load ends here before the world runs.","deps":{"load_ladder":"host","agents_soa":"data","ledger_check":"data"},"breaks":"A new pool or index column absent from the sweep escapes validation entirely; the sweep itself now runs at runtime as well as on load.","score":"green","whyScore":"Thorough gate (lengths, finiteness, convoy bijection, hill bounds). check() calls validate_schema() first (lib.rs:1027-1028), so the bounds are enforced on every save and checked batch, not only on load; the markets bound shares MAX_MARKETS with runtime founding.","verify":false,"metrics":{"loc":100,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"sim/crates/sim-core/src/lib.rs","s":3175,"e":3195,"text":"        let mut membership = vec![NONE; n];\n        for (slot, c) in self.convoys.iter().enumerate() {\n            if let Some(c) = c {\n                if c.members.is_empty()\n                    || c.members.len() > travel::MAX_CONVOY\n                    || ![c.x, c.y, c.goal_x, c.goal_y].iter().all(|v| v.is_finite())\n                {\n                    return Err(\"Invalid convoy\".into());\n                }\n                for &id in &c.members {\n                    let i = id as usize;\n                    if i >= n || membership[i] != NONE || a.convoy[i] != slot as u32 {\n                        return Err(\"Invalid convoy membership\".into());\n                    }\n                    membership[i] = slot as u32;\n                }\n            }\n        }\n        if membership != a.convoy {\n            return Err(\"Orphan convoy membership\".into());\n        }"},{"file":"sim/crates/sim-core/src/lib.rs","s":1028,"e":1029,"text":"    pub fn check(&self) -> Result<(), String> {\n        self.validate_schema()?;"}]}]},"domain":{"label":"DOMAIN","blurb":"the business rules the system exists to run: market economy, needs, memory subsystems","parts":[{"id":"economy_refresh","label":"Market quotes + escrow refresh","file":"sim/crates/sim-core/src/lib.rs","what":"refresh() every 10 ticks: per-market per-good target stocks, bid/ask quotes computed from population deficit, escrow reserved from market coins.","why":"The price engine — every buy/sell lands on these quotes; escrow accounting is what keeps money conserved while bids float.","deps":{"ledger_check":"data","step_orchestrator":"host","economy_module":"data"},"breaks":"Quotes regenerate wholesale each refresh — a market's coins are re-escrowed against current population; an accounting slip in cancel_quotes/add silently mints or burns (caught by check()).","score":"yellow","whyScore":"Integer-accounted escrow math with conservation test coverage; the tuning constants (pop/3, /10, /16 targets, bid cap 8) are embedded arithmetic — balance parameters :"data","terrain_layer":"data","protocol_checks":"test"},"breaks":"Class byte order must match Terrain enum declaration (Water0..River6) — mirrored by terrain_layer.gd TERRAIN_COLORS[7]; check_protocol asserts max(classes) ≤ 6 and exact raster sizes.","score":"green","whyScore":"Verified by check_protocol.py:66-75 (768×480×4.0 raster, base64 lengths, class bound, explored chunk mask size); terrain only refreshes on request.","metrics":{"loc":27,"testLines":0,"comments":2,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"sim/crates/sim-runner/src/main.rs","s":390,"e":418,"text":"/// Terrain raster and fog-of-war mask for viewers. Sent on request, not in\n/// every snapshot, because the raster only changes with the map.\nfn map_layers(world: &mut World, terrain: bool) -> Value {\n    let (cols, rows, known) = world.explored.known_mask(&world.map.spec);\n    let mut layers = json!({\n        \"map\": world.map.spec,\n        \"explored\": {\"cols\": cols, \"rows\": rows, \"chunk\": sim_core::CHUNK_SIZE, \"known\": base64(&known)},\n    });\n    if terrain {\n        let r = world.map.raster();\n        let rivers: Vec<Value> = world\n            .map\n            .rivers()\n            .iter()\n            .map(|river| json!({\"w\": river.width, \"p\": river.points}))\n            .collect();\n        let labels: Vec<Value> = r\n            .region_labels\n            .iter()\n            .map(|(n, x, y)| json!({\"n\": n, \"x\": x, \"y\": y}))\n            .collect();\n        layers[\"terrain\"] = json!({\n            \"cols\": r.cols, \"rows\": r.rows, \"cell\": r.cell,\n            \"classes\": base64(&r.terrain), \"elevation\": base64(&r.elevation), \"qi\": base64(&r.qi),\n            \"regions\": base64(&r.regions), \"region_labels\": labels, \"rivers\": rivers,\n        });\n    }\n    layers\n}"}]},{"id":"checkpoint_payload","label":"checkpoint_payload + save — tuple tails","file":"sim/crates/sim-core/src/lib.rs","what":"postcard-serializes (World, memories, map, (explored, carcasses, spawns, spears, bows, hunting_stats, meat_trade, market_information, demand), (governance, rumours, water, traffic)) → zstd → XXSAVE34+len envelope → atomic tmp+rename write.","why":"Write-side of the save contract; the nested tuple ORDER is the schema — load's tail chain must walk it in exactly this order.","deps":{"load_ladder":"data","world_monolith":"data","dev_py":"test"},"breaks":"Insert a field mid-tuple and every older-version tail read lands on the wrong type — loud for old headers (they branch before the tail) but the nesting order is the contract, mirrored nowhere outside this call and the load chain.","score":"green","whyScore":"Round-trip + replay equality tested (checkpoint_replays_exactly, checkpoint_load_preserves_world_state_exactly); atomic write prevents torn checkpoints; refuses to save during a memory-pilot trial; tail order mirrors the load chain, which real dev-v34 and release-v33 fixtures now exercise.","metrics":{"loc":40,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"sim/crates/sim-core/src/lib.rs","s":2697,"e":2727,"text":"    pub fn checkpoint_payload(&self) -> Result<Vec<u8>, String> {\n        if self.watch.memory_trial.is_some() {\n            return Err(\"The developer memory pilot cannot be checkpointed. Finish the experiment without saving.\".into());\n        }\n        postcard::to_allocvec(&(\n            self,\n            &self.food_memory,\n            &self.forage_memory,\n            &self.work_memory,\n            &self.commitments,\n            &self.map,\n            (\n                &self.explored,\n                &self.carcasses,\n                &self.wildlife.spawns,\n                &self.wildlife.spears,\n                &self.wildlife.bows,\n                &self.wildlife.hunting_stats,\n                &self.meat_trade,\n                &self.market_information,\n                &self.meat_trade.demand,\n            ),\n            (\n ans extending this\n/// table, not eight hand-maintained header lists.\nstruct SaveVersion(u8);\nimpl SaveVersion {\n    const CURRENT: u8 = 34;\n    /// Parses the `XXSAVEnn` magic into a supported version number.\n    fn parse(data: &[u8]) -> Result<Self, String> {\n        let ok = data.len() >= 16\n            && &data[..6] == b\"XXSAVE\"\n            && data[6].is_ascii_digit()\n            && data[7].is_ascii_digit()\n            && (4..=Self::CURRENT).contains(&(10 * (data[6] - b'0') + (data[7] - b'0')));\n        if !ok {\n            return Err(\"Invalid checkpoint header\".into());\n        }\n        Ok(Self(10 * (data[6] - b'0') + (data[7] - b'0')))\n    }\n    /// Development format: base tuple + version-appended tails (v20-29, v34).\n    fn dev_family(&self) -> bool {\n        matches!(self.0, 20..=29 | 34)\n    }\n    /// Release format: older tuple + action remap (v19, v30-33).\n    fn release_family(&self) -> bool {\n        self.0 == 19 || (30..=33).contains(&self.0)\n    }\n    /// Versions that don't carry a map and get the classic layout\n    /// regenerated (v4-14, 16-18; v15 and v19+ load their own).\n    fn needs_classic_map(&self) -> bool {\n        self.0 <= 14 || (16..=18).contains(&self.0)\n    }\n    /// Versions that stored wildlife spawns in a tail — don't reset them\n    /// (v21-29, v34). Release-family and earlier saves get a fresh spawn set.\n    fn has_tail_spawns(&self) -> bool {\n        matches!(self.0, 21..=29 | 34)\n    }\n    /// Versions that stored terrain spawn points/habitats in a tail\n    /// (v22-29, v34); everything else derives them on load.\n    fn has_tail_spawn_habitats(&self) -> bool {\n        matches!(self.0, 22..=29 | 34)\n    }\n    /// Versions that stored governance state (v30-34); older saves run one\n    /// governance step on load to establish councils.\n    fn has_governance(&self) -> bool {\n        self.0 >= 30\n    }\n}"},{"file":"sim/crates/sim-core/src/lib.rs","s":2886,"e":2896,"text":" er's full serde schema and fails on any difference, including reorders and same-size type swaps. The fix is still a twin per changed type, written when the change is made.","score":"yellow","whyScore":"Detection is exact (#54 partial): legacy_reader_schemas_are_pinned compares each reader's traced registry with legacy_schema.json, and legacy_readers_trust_no_new_live_types holds an allowlist that can only shrink. A same-size field swap on Corpse fails it for every reader (checked by mutation). The first batch of gameplay types is frozen, and the real bank-v12 bytes replay to the same digest. Fixture coverage for v4-18 is still the synthetic bank-v12 checkpoint alone.","metrics":{"loc":2092,"testLines":470,"comments":8,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"sim/crates/sim-core/src/legacy_v12.rs","s":1,"e":11,"text":"//! Explicit schema-12 reader: initializes empty learned relationships.\n//! Frozen layouts this schema decodes into: LegacyAgents, LegacyAspiration, LegacyCouncil,\n//!   LegacyGoal, LegacyGoalKind, LegacyLedger, LegacyLot, LegacyMarket, LegacyPerson,\n//!   LegacyPolicyChoice, LegacyPregnancy, LegacyProject, LegacyQuote, LegacyStatistics.\n//! Live types it still trusts: Action, Animal, AnimalPregnancy, Bank, Banking, Building,\n//!   Contract, Convoy, Corpse, EcologyLedger, Education, Estate, Farm, FertileRegion, Forest,\n//!   Gene, Genome, Grass, Graveyard, Innovations, Job, JobKind, Kind, Loan, Node, Patch,\n//!   Progress, Rng, Road, School, Shelter, Tavern, TownState, Urban, Wildlife, Zone.\n//! A serde-layout change to a live type reinterprets this version's saved\n//! bytes; legacy_schema::legacy_reader_schemas_are_pinned fails first —\n//! freeze a Legacy twin in legacy_types.rs before changing the type (#54)."},{"file":"sim/crates/sim-core/src/legacy_v12.rs","s":33,"e":37,"text":"    pub councils: Vec<legacy_types::LegacyCouncil>,\n    pub corpses: Vec<Corpse>,\n    pub contracts: Vec<Option<Contract>>,\n    pub graveyards: Vec<   CraftSpear = 41,\n    CraftBow = 58,\n    Recover = 59,\n    Play = 60,\n    CollectMeat = 61,\n    SellMeat = 62,\n    BuyMeat = 63,\n    BuyInformation = 64,\n    SellInformation = 65,\n    NominateSelf = 66,\n    DiscussCamp = 67,\n    MigrateToCamp = 68,\n    DeliverWaterReport = 69,"},{"file":"sim/crates/sim-core/src/lib.rs","s":4077,"e":4093,"text":"    fn every_action_remapped_below_the_six_bit_wire_budget() {\n        let mut decoded = 0usize;\n        for index in 0..128u8 {\n            let Ok(action) = postcard::from_bytes::<Action>(&[index]) else {\n                break;\n            };\n            decoded += 1;\n            assert!(\n                (action.wire() as u8) < 64,\n                \"{action:?} (repr {}) has no legacy wire mapping\",\n                action as u8\n            );\n        }\n        // Bump the count when appending variants — and keep wire() covering\n        // any repr 64+.\n        assert_eq!(decoded, 54);\n    }"}]},{"id":"brain_migration","label":"migrate_brain_schemas + neat-core input migration","file":"sim/crates/sim-core/src/lib.rs","what":"On load: detects 42/48-input genomes, shifts node IDs up to 52, migrates the three Innovation registries (world/council/wildlife), reconnects need/food-readiness inputs, then recompiles every brain.","why":"The schema bridge between old brains and the 52-sensor present — memory node IDs are pinned at u32::MAX-3.. so the shift can't collide.","deps":{"neat_core":"data","load_ladder":"host","civic_governance":"data","wildlife_module":"data"},"breaks":"The registry and genome must migrate in the same pass (migrate_inputs + migrate_node_ids); doing one without the other desyncs innovation numbering — documented in code, done correctly, but order-sensitive.","score":"yellow","whyScore":"Correct three-registry handling with a documented pairing requirement (neat-core lib.rs:553-555); needs_input_migration detection is by input count so already-migrated genomes don't double-shift; me wrap()) as usize;\n        if len == 0 || len > 1_048_576 {\n            return Err(\"Invalid command frame size\".into());\n        }\n        if buffer.len() < 4 + len {\n            break;\n        }\n        messages.push(serde_json::from_slice(&buffer[4..4 + len]).map_err(|e| e.to_string())?);\n        buffer.drain(..4 + len);\n        if messages.len() >= 32 {\n            break;\n        }\n    }\n    Ok(messages)\n}"}]},{"id":"ready_handshake","label":"XIANXIA_READY_FILE atomic readiness","file":"sim/crates/sim-runner/src/main.rs","what":"Backend binds port 0, writes {pid, port} to <path>.tmp then renames to the ready file; dev.py polls for the file and verifies the recorded pid equals the child's.","why":"Port-zero assignment + atomic discovery is what lets concurrent backends/tests coexist without port races — the isolation mechanism every test relies on.","deps":{"serve_loop":"data","dev_py":"test"},"breaks":"If the tmp+rename order flipped, launchers could read a half-written port; if the pid check were skipped, a stale ready file could bind a viewer to a dead port — both are correct today.","score":"green","whyScore":"Atomic write-then-rename (main.rs:591-597) + pid verification in dev.py:80-88 + isolation test proves two backends get distinct ports and one dying leaves the other's save intact.","metrics":{"loc":8,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"sim/crates/sim-runner/src/main.rs","s":591,"e":597,"text":"    if let Some(path) = env::var_os(\"XIANXIA_READY_FILE\") {\n        let path = PathBuf::from(path);\n        let temp = path.with_extension(\"tmp\");\n        let ready = json!({\"pid\":std::process::id(),\"port\":port});\n        fs::write(&temp, ready.to_string()).map_err(|e| e.to_string())?;\n        fs::rename(temp, path).map_err(|e| e.to_string())?;\n    }"}]},{"id":"viewer_tcp","label":"main.gd TCP client — newest-frame-wins","file":"viewer/main.gd","what":"Polls socket, reassembles 4-byte-prefixed frames, buffers XNS1 frames and decodes only the NEWEST (drops stale snapshots), JSON-decodes XNC1 replies, reconnects every 2s.","why":"The client half of the conduit — drop-stale keeps an overloaded viewer from falling ever further behind.","deps":{"tcp_framing":"data","serve_loop":"data","snapshot_encoder":"data","field_decoder":"host"},"breaks":"On reconnect the viewer re-selects agent 0 and re-enables the building stream silently; an earlier selection is lost.","score":"yellow","whyScore":"Solid reassembly + stale-drop policy; the 4 MiB bound is now a shared contract: MAX_VIEWER_FRAME in main.gd:39 and main.rs:440, with the server filtering oversize snapshots and replying with a diagnostic once (main.rs:541-553) instead of letting the viewer loop on reconnects.","verify":false,"metrics":{"loc":60,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"viewer/main.gd","s":859,"e":866,"text":"\tvar newest_snapshot := PackedByteArray()\n\twhile incoming.size() >= 4:\n\t\tvar length := int(incoming.decode_u32(0))\n\t\tif length < 4 or length > MAX_VIEWER_FRAME:\n\t\t\tnotice.text = \"Invalid native snapshot frame.\"\n\t\t\t_connect()\n\t\t\treturn\n\t\tif incoming.size() < length+4:"},{"file":"sim/crates/sim-runner/src/main.rs","s":541,"e":553,"text":"    fn send(&mut self, snapshot: Option<Vec<u8>>) -> Result<(), String> {\n        let snapshot = snapshot.filter(|bytes| {\n            if bytes.len() <= MAX_VIEWER_FRAME {\n                self.oversize_reported = false;\n                true\n            } else {\n                if !self.oversize_reported {\n                    self.reply(\"World snapshot exceeds the 4 MiB viewer limit.\", false);\n                    self.oversize_reported = true;\n                }\n                false\n            }\n        });"}]}]},"surface":{"label":"SURFACE","blurb":"the presentation: wire decode, rendering, picking, inspector panels — the reader of everything above","parts":[{"id":"field_decoder","label":"field.gd receive() — record decode","file":"viewer/field.gd","what":"Unpacks each 16-byte person record: id, xy, action&63 | rested&64 | grouped&128, kind&15 | carried&32 | hidden&64 | sleeping&128, health&127 | child&128, home byte; rebuilds spatial hash for picking.","why":"The decode half of the wire contract — the mirror that must match the Rust encoder bit-for-bit.","deps":{"snapshot_encoder":"data","contract_readme":"data","viewer_tcp":"data"},"breaks":"Any encoder flag move silently misrenders (e.g. a shifted bit reads as 'rested' for everyone); no shared schema — parity rests on the protocol+connection tests and careful review.","score":"yellow","whyScore":"Bit positions match the encoder exactly (verified in audit: byte12 action/64/128, byte13 kind/32/64/128, byte14 health/128, byte15 home); exercised live by connection_check — still a hand-mirrored decode across languages with no generated schema.","metrics":{"loc":62,"testLines":0,"comments":0,"panics":0,"todos":0,"unsafe":0},"excerpts":[{"file":"viewer/field.gd","s":205,"e":221,"text":"\t\tvar at := i * 16\n\t\tvar id: int = records.decode_u32(at)\n\t\tvar p := Vector2(records.decode_float(at+4),records.decode_float(at+8))\n\t\tvar same: bool = i < old_count and ids[i] == id\n\t\tdraw_points[i] = points[i] if same else p\n\t\tmoving[i] = 1 if same and points[i].distance_squared_to(p) > 0.01 else 0\n\t\tpoints[i] = p\n\t\tids[i] = id\n\t\tactions[i] = records[at+12] & 63\n\t\tkinds[i] = records[at+13] & 15\n\t\thidden_flags[i] = 1 if (records[at+13] & 64) != 0 else 0\n\t\tcarrying_flags[i] = 1 if (records[at+13] & 32) != 0 else 0\n\t\trested_flags[i] = 1 if (records[at+12] & 64) != 0 else 0\n\t\tsleeping_flags[i] = 1 if (records[at+13] & 128) != 0 else 0\n\t\tgrouped_flags[i] = 1 if (records[at+12] & 128) != 0 else 0\n\t\thealths[i] = records[at+14] & 127\n\t\tchild_flags[i] = 1 if (records[at+14] & 128) != 0 else 0"}]},{"id":"main_gd","label":"main.gd — inspector + XNS1 decode","file":"viewe <script>/* report-ui.js — renderer for teardown-report.html. Reads window.AUDIT.
   No deps, no network. Tabs: pipeline | issues | explainer. */
(function () {
'use strict';
const A = window.AUDIT || {};
const meta = A.meta || {};
const stations = A.stations || {};
const fixes = A.fixes || {};
const RANK = { green: 0, yellow: 1, orange: 2, red: 3, black: 4 };
const RNAME = { green: 'healthy', yellow: 'attention', orange: 'debt', red: 'risk', black: 'unexplained' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- normalize -------------------------------------------------------------
const allParts = [];
const byId = {};
const bare = {};   // bare id -> [qid] for dep resolution
for (const [sid, st] of Object.entries(stations)) {
  const parts = st.parts || [];
  for (const p of parts) {
    const q = Object.assign({}, p);
    q.station = sid;
    // ids may be bare ("spec_root") or already qualified ("spec:spec_root")
    q.qid = p.id.indexOf(':') >= 0 ? p.id : sid + ':' + p.id;
    const bareId = p.id.split(':').pop();
    q.fix = p.fix != null ? p.fix : (fixes[q.qid] || fixes[p.id] || fixes[bareId] || '');
    allParts.push(q);
    byId[q.qid] = q;
    (bare[bareId] = bare[bareId] || []).push(q.qid);
  }
  st.worst = parts.reduce((a, p) => Math.max(a, RANK[p.score] != null ? RANK[p.score] : 0), 0);
  st.nVerify = parts.filter((p) => p.verify).length;
}
const counts = { green: 0, yellow: 0, orange: 0, red: 0, black: 0, verify: 0 };
for (const p of allParts) { counts[p.score]++; if (p.verify) counts.verify++; }
const worst = allParts.reduce((a, p) => (RANK[p.score] > RANK[a.score] ? p : a),
  allParts[0] || { label: '(none)', score: 'green', file: '' });

function depQid(sid, to) {
  if (to.indexOf(':') >= 0 && byId[to]) return to;
  const q = sid + ':' + to;
  if (byId[q]) return q;
  const g = bare[to];
  if (g && g.length === 1) return g[0];
  return byId[q] ? q : (to.indexOf(':') >= 0 ? to : null);
}

// ---- state + routing ---------------------------------------------------------
const state = { tab: 'pipeline', station: null, part: null, sev: 'issues', q: '' };
const issueTotal = counts.red + counts.orange + counts.yellow + counts.black;
if (issueTotal === 0) state.sev = 'all';

function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  const [tab, kv] = h.split(':');
  if (['pipeline', 'issues', 'explainer'].includes(tab)) state.tab = tab;
  if (kv) {
    const m = kv.match(/p=(.+)/); if (m && byId[m[1]]) state.part = m[1];
    const s = kv.match(/st=(.+)/); if (s && stations[s[1]]) state.station = s[1];
  }
}
function writeHash() {
  let h = '#' + state.tab;
  if (state.part && state.tab !== 'explainer') h += ':p=' + encodeURIComponent(state.part);
  history.replaceState(null, '', h);
}
parseHash();

// ---- top bar -----------------------------------------------------------------
const root = document.getElementById('app');
function renderTop() {
  const cc = ['red', 'orange', 'yellow', 'black', 'verify', 'green'].map((k) =>
    '<button class="count" data-sev="' + k + '">' +
    (k === 'verify' ? '<span style="color:var(--red);font-weight:800">?</span>' : '<span class="dot s-' + k + '"></span>') +
    counts[k] + '</button>').join('');
  const name = meta.name || 'Teardown';
  const suffix = /teardown/i.test(name) ? '' : ' <i>teardown</i>';
  return '<div class="top"><div class="top-in">' +
    '<h1>' + esc(name) + suffix + '</h1>' +
    '<span class="date">' + esc(meta.generated || '') + '</span>' +
    '<div class="counts">' + cc + '</div>' +
    '<div class="tabs">' +
    ['pipeline', 'issues', 'explainer'].map((t) =>
      '<button class="tab' + (state.tab === t ? ' on' : '') + '" data-tab="' + t + '">' + t + '</button>').join('') +
    '</div></div></div>';
}

// ---- shared dossier ----------------------------------------------------------
function metricBoxes(p) {
  const m = p.metrics || {};
  const boxes = [
    ['loc', m.loc], ['tests', m.testLines], ['comments', m.comments],
    ['panics', m.panics], ['todos', m.todos], ['unsafe', m.unsafe],
  ].filter((b) => b[1] != null);
  if (!boxes.length) return '';
  return '<div class="card"><h3>Metrics</h3><div class="metrics">' +
    boxes.map((b) => '<div class="mbox' + ((b[0] === 'panics' || b[0] === 'unsafe' || b[0] === 'todos') && b[1] > 0 ? ' bad' : '') +
      '"><span class="k">' + b[0] + '</span>' + b[1] + '</div>').join('') +
    '</div></div>';
}

function excerptHtml(ex) {
  const head = '<div class="ex-h">' + esc(ex.file) + ' : ' + ex.s + '–' + ex.e + '</div>';
  if (!ex.text) return head + '<div class="ex-h" style="opacity:.7">citation — excerpt not inlined</div>';
  const lines = String(ex.text).split('\n');
  const body = lines.map((l, i) =>
    '<span class="ln">' + (ex.s + i) + '</span>' + esc(l)).join('\n');
  return head + '<pre class="code">' + body + '</pre>';
}

function dossier(p) {
  if (!p) return '<div class="empty">Select a part.</div>';
  const deps = Object.entries(p.deps || {}).map(([to, kind]) => {
    const q = depQid(p.station, to);
    const tgt = q ? byId[q] : null;
    return '<button class="dep" data-part="' + esc(q || to) + '"' + (tgt ? '' : ' disabled') + '>' +
      (tgt ? '<span class="dot s-' + tgt.score + '"></span>' : '') +
      '→ ' + esc(to) + ' <i>' + esc(kind) + '</i></button>';
  }).join('');
  const ex = (p.excerpts || []).map(excerptHtml).join('');
  return '<div class="dossier">' +
    '<div class="d-hd"><div class="crumb">' + esc(p.station) + ' · ' + esc(p.file) + '</div>' +
    '<h2><span class="dot s-' + p.score + '" style="width:12px;height:12px"></span>' + esc(p.label) +
    ' <span class="pill p-' + p.score + '">' + esc(RNAME[p.score] || p.score) + '</span>' +
    (p.verify ? ' <span class="pill-vfy">flagged — verify</span>' : '') + '</h2>' +
    '<div class="meta-line"><span>' + esc(p.file) + '</span>' +
    (p.metrics && p.metrics.loc ? '<span>' + p.metrics.loc + ' lines audited</span>' : '') +
    '</div></div>' +
    '<div class="grid2">' +
    '<div class="card"><h3>What it does</h3><p>' + esc(p.what) + '</p></div>' +
    '<div class="card"><h3>Why it exists</h3><p>' + esc(p.why) + '</p></div>' +
    '</div>' +
    '<div class="grid2">' +
    '<div class="card warn"><h3>Breaks if changed</h3><p>' + esc(p.breaks || '—') + '</p></div>' +
    '<div class="card"><h3>Scored ' + esc(RNAME[p.score] || p.score) + ' because</h3><p>' + esc(p.whyScore || '—') + '</p></div>' +
    '</div>' +
    (p.fix ? '<div class="card fix"><h3>Recommendation</h3><p>' + esc(p.fix) + '</p></div>' : '') +
    (deps ? '<div class="card"><h3>Depends on</h3><div class="deps">' + deps + '</div></div>' : '') +
    metricBoxes(p) +
    (ex ? '<div class="card"><h3>Evidence</h3>' + ex + '</div>' : '') +
    '</div>';
}

// ---- PIPELINE tab --------------------------------------------------------------
function renderPipeline() {
  const ids = Object.keys(stations);
  if (!state.station && ids.length) state.station = ids[0];
  const strip = ids.map((sid, i) => {
    const st = stations[sid];
    const w = ['green', 'yellow', 'orange', 'red', 'black'][st.worst || 0];
    return (i ? '<span class="arr">→</span>' : '') +
      '<button class="stn' + (state.station === sid ? ' on' : '') + '" data-st="' + sid + '">' +
      '<span class="halo"><span class="dot s-' + w + '"></span></span>' +
      '<div class="nm">' + esc(st.label || sid) + '</div>' +
      '<div class="mt">' + (st.parts || []).length + ' parts' +
      (st.nVerify ? ' · <span class="vfy">' + st.nVerify + ' verify</span>' : '') + '</div>' +
      '</button>';
  }).join('');

  const st = stations[state.station] || {};
  const rows = (st.parts || []).map((p) => {
    const q = byId[p.id.indexOf(':') >= 0 ? p.id : state.station + ':' + p.id];
    const loc = p.metrics && p.metrics.loc;
    return '<button class="prow' + (state.part === q.qid ? ' on' : '') + '" data-part="' + esc(q.qid) + '">' +
      '<span class="dot s-' + p.score + '"></span><span class="lb">' + esc(p.label) + '</span>' +
      (p.verify ? '<span class="vbadge">VERIFY</span>' : '') +
      (loc ? '<span class="lc">' + loc + 'L</span>' : '') + '</button>';
  }).join('');

  const sel = state.part && byId[state.part] && byId[state.part].station === state.station
    ? byId[state.part] : null;

  return '<div class="page">' +
    '<div class="conduit">' + strip + '</div>' +
    (meta.conduit ? '<p class="loopnote">conduit: ' + esc(meta.conduit) + '</p>' : '') +
    '<div class="pipe-grid">' +
    '<div class="plist"><div class="ph"><span>' + esc(st.label || state.station) + '</span>' +
    '<span>' + (st.parts || []).length + ' parts</span></div>' +
    (st.blurb ? '<div class="blurb">' + esc(st.blurb) + '</div>' : '') +
    rows + '</div>' +
    '<div>' + dossier(sel) + '</div>' +
    '</div></div>';
}

// ---- ISSUES tab ------------------------------------------------------------------
function visibleIssues() {
  const q = state.q.trim().toLowerCase();
  return allParts.filter((p) => {
    if (state.sev === 'issues' && p.score === 'green') return false;
    if (state.sev === 'verify' && !p.verify) return false;
    if (['red', 'orange', 'yellow', 'green', 'black'].includes(state.sev) && p.score !== state.sev) return false;
    if (!q) return true;
    return (p.label + ' ' + p.qid + ' ' + p.file + ' ' + (p.what || '') + ' ' + (p.breaks || '')).toLowerCase().includes(q);
  });
}

function renderIssues() {
  const FILTERS = [
    ['issues', 'Issues (' + issueTotal + ')'], ['red', 'Red (' + counts.red + ')'],
    ['orange', 'Orange (' + counts.orange + ')'], ['yellow', 'Yellow (' + counts.yellow + ')'],
    ['verify', 'Verify (' + counts.verify + ')'], ['green', 'Green (' + counts.green + ')'],
    ['all', 'All (' + allParts.length + ')'],
  ];
  const items = visibleIssues();
  const list = items.map((p) => {
    const hdr = '';
    return '<button class="prow' + (state.part === p.qid ? ' on' : '') + '" data-part="' + esc(p.qid) + '">' +
      '<span class="dot s-' + p.score + '"></span><span class="lb">' + esc(p.label) + '</span>' +
      (p.verify ? '<span class="vbadge">VERIFY</span>' : '') +
      '<span class="lc">' + esc(p.station) + '</span></button>';
  }).join('');
  const sel = state.part && byId[state.part] ? byId[state.part] : items[0];
  return '<div class="page"><div class="issues">' +
    '<div class="iside"><div class="flt">' +
    '<input id="iq" class="search" type="search" placeholder="Filter by name, file, symptom…" value="' + esc(state.q) + '">' +
    '<div class="chips">' + FILTERS.map((f) =>
      '<button class="chip' + (state.sev === f[0] ? ' on' : '') + '" data-sev="' + f[0] + '">' +
      (['red', 'orange', 'yellow', 'green'].includes(f[0]) ? '<span class="dot s-' + f[0] + '"></span>' : '') +
      f[1] + '</button>').join('') + '</div></div>' +
    '<div class="ilist">' + (items.length ? list : '<div class="empty">No matching parts.</div>') + '</div></div>' +
    '<div>' + dossier(sel) + '</div>' +
    '</div></div>';
}

// ---- EXPLAINER tab -----------------------------------------------------------------
function rubRow(color, when, eg) {
  return '<tr><td><span class="dot s-' + color + '"></span> <b class="t-' + color + '">' + RNAME[color] + '</b></td>' +
    '<td>' + when + '</td><td>' + eg + '</td></tr>';
}
function renderExplainer() {
  return '<div class="page"><div class="expl">' +
    '<blockquote><b>The Teardown Test.</b> Any behaviour must decompose recursively from business outcome to ' +
    'implementation evidence — no tribal knowledge, no production data. The goal is not bugs; it is where the ' +
    'system grows faster than humans can follow. <b>Every score carries its own evidence</b> (<code>file:lines</code>, ' +
    'the metric that fired, or the verdict + reason). The test is recursive: an uncited score is itself a finding.</blockquote>' +

    '<div><h2>How this report was built</h2><div class="stepgrid">' +
    [['00', 'OVERVIEW', 'Found the conduit — what enters, what exits, what transforms it, and the loop that feeds output back.'],
     ['01', 'ASK', 'Read the system\'s own rules first; audit against the real code, never the docs\' claims.'],
     ['02', 'PARTS', 'Each station decomposed into cited parts: what / why / depends-on / breaks-if / excerpts.'],
     ['03', 'MEASURE', 'Mechanical signals per part: impl vs test LOC, comment density, panics, debt markers, fan-in/out, cross-file consistency diffs.'],
     ['04', 'SCORE', 'Five-level rubric; every verdict cited. Suspicions flagged verify, never asserted.'],
     ['05', 'COUNCIL', 'Specialist read-only passes: contract sync, ABI, API rules, concurrency, serialization, docs.'],
     ['06', 'DIVE', 'Recursive traces from user-visible behaviour to lines of code — an untraceable hop is a finding.'],
     ['07', 'VERDICT', 'Findings go upstream to the source; the audit regenerates on every change.']]
      .map((s) => '<div class="stepcard"><div class="n">' + s[0] + '</div><div class="t">' + s[1] +
        '</div><div class="d">' + s[2] + '</div></div>').join('') + '</div></div>' +

    '<div><h2>The rubric</h2><table class="rub"><thead><tr><th>Level</th><th>Fires when</th><th>Meaning</th></tr></thead><tbody>' +
    rubRow('green', 'documented, tested contract, sync-verified, no panics in path', 'safe to build on') +
    rubRow('yellow', 'dense logic + thin docs, contract only in comments, or a real finding logged', 'needs attention') +
    rubRow('orange', 'hand-duplicated contract, doc claims a mechanism that isn\'t there', 'architectural debt') +
    rubRow('red', 'a change here can corrupt silently — shapes/orderings assumed, not checked', 'high risk') +
    rubRow('black', 'no evidence trail — nobody can say why it works', 'explainability failure') +
    '</tbody></table>' +
    '<p class="lead" style="margin-top:10px">The dashed <b>verify</b> flag marks flagged-not-proven findings: ' +
    'suspected coverage gaps awaiting the experiment that would prove them.</p></div>' +

    '<div><h2>Reading this report</h2><ul>' +
    '<li><b>Pipeline</b> — the conduit, station by station; each station inherits its worst part\'s score. ' +
    'Click a part for its dossier: what · why · depends-on · breaks-if · scored-because · evidence.</li>' +
    '<li><b>Issues</b> — the tracker: filter by severity or text; every entry is a cited part, not an opinion.</li>' +
    '<li><b>Deps chips</b> — typed dependency edges (data · test · host · hash); click to jump between parts.</li>' +
    (RANK[worst.score] > 0
      ? '<li>Headline open finding: <b class="t-' + worst.score + '">' + esc(worst.label) + '</b> — ' + esc(worst.file) + '</li>'
      : '<li>Headline: <b class="t-green">all parts green</b> — every score is cited; keep the audit regenerating.</li>') +
    '</ul></div>' +

    '<div><h2>Current ledger</h2><p class="lead">' +
    counts.green + ' healthy · ' + counts.yellow + ' attention · ' + counts.orange + ' debt · ' +
    counts.red + ' risk · ' + counts.black + ' unexplained · ' + counts.verify + ' flagged for verification · ' +
    allParts.length + ' parts across ' + Object.keys(stations).length + ' stations.' +
    ' Regenerate this file from the audit JSON — never hand-edit it.</p></div>' +
    '</div></div>';
}

// ---- mount + events ---------------------------------------------------------------
function render() {
  root.innerHTML = renderTop() +
    '<div id="body">' +
    (state.tab === 'pipeline' ? renderPipeline()
      : state.tab === 'issues' ? renderIssues()
      : renderExplainer()) +
    '</div>';
  wire();
  window.scrollTo(0, 0);
  writeHash();
}

function wire() {
  root.querySelectorAll('[data-tab]').forEach((b) => {
    b.onclick = () => { state.tab = b.dataset.tab; state.part = null; render(); };
  });
  root.querySelectorAll('[data-sev]').forEach((b) => {
    b.onclick = () => {
      state.tab = 'issues';
      state.sev = b.dataset.sev === 'issues' ? 'issues' : b.dataset.sev;
      render();
    };
  });
  root.querySelectorAll('[data-st]').forEach((b) => {
    b.onclick = () => { state.station = b.dataset.st; state.part = null; render(); };
  });
  root.querySelectorAll('[data-part]').forEach((b) => {
    b.onclick = () => {
      const q = b.dataset.part;
      if (!byId[q]) return;
      state.part = q;
      state.station = byId[q].station;
      render();
    };
  });
  const iq = document.getElementById('iq');
  if (iq) iq.oninput = () => { state.q = iq.value; renderListOnly(); };
}
function renderListOnly() {
  const il = root.querySelector('.ilist');
  if (!il) return;
  const items = visibleIssues();
  il.innerHTML = items.length
    ? items.map((p) => '<button class="prow' + (state.part === p.qid ? ' on' : '') + '" data-part="' + esc(p.qid) + '">' +
        '<span class="dot s-' + p.score + '"></span><span class="lb">' + esc(p.label) + '</span>' +
        (p.verify ? '<span class="vbadge">VERIFY</span>' : '') +
        '<span class="lc">' + esc(p.station) + '</span></button>').join('')
    : '<div class="empty">No matching parts.</div>';
  il.querySelectorAll('[data-part]').forEach((b) => {
    b.onclick = () => { state.part = b.dataset.part; render(); };
  });
}

window.addEventListener('hashchange', () => { parseHash(); render(); });
render();
})();
</script>
</body>
</html>
